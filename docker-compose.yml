services:
  netshield:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      NETSHIELD_ENV: development
      ENABLE_LOCAL_CAPTURE: "false"
      NETSHIELD_DEMO_STREAM: "false"
    volumes:
      # SQLite and uploads are the only writable application paths. The rest
      # of the root filesystem is read-only.
      - netshield-instance:/app/instance
      - netshield-uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  netshield-instance:
  netshield-uploads:
