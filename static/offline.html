<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — NetShield</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0d1b2a;
      color: #e6f1ff;
      text-align: center;
      padding: 1.5rem;
    }
    h1 { font-size: 1.4rem; margin: 0; }
    p { max-width: 32ch; color: #9fb3c8; margin: 0; }
    button {
      margin-top: .5rem;
      padding: .7rem 1.4rem;
      border-radius: 999px;
      border: 1px solid #38bdf8;
      background: transparent;
      color: #38bdf8;
      font-size: 1rem;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <h1>You're offline</h1>
  <p>NetShield can't reach the server right now. Check your connection — pages you've already visited may still work.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
